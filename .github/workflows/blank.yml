name: Run TV Parser

on:
  workflow_dispatch: # Запуск только вручную по кнопке

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем файлы репозитория (скрипт tv2.py и маппинг)
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Активируем Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # 3. Подключаем постоянное хранилище (кэш) для папки bydate и библиотек
    - name: Cache packages and bydate folder
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          bydate
        key: ${{ runner.os }}-tv-parser-cache-v1

    # 4. Устанавливаем библиотеку requests (в первый раз скачается, потом будет из кэша)
    - name: Install dependencies
      run: pip install requests

    # 5. Запускаем ваш Python-скрипт парсера
    - name: Run parser script
      run: python tv2.py

    # 6. Подготавливаем созданный файл zzzfinal.xml для публикации
    - name: Upload artifact for Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'
        exclude: |
          bydate/**
          .github/**
          tv2.py
          channels_mapping.csv

    # 7. Публикуем файл на GitHub Pages (создаем прямую ссылку)
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
